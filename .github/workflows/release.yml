name: Release

# v1.2.3 のようなタグを push すると、3 つの OS 向けにビルドして
# GitHub Release に添付する。Mac を持っていなくても macOS 版が作れる。
# 手動で試したいときは Actions タブから「Run workflow」でも起動できる。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: テスト
        run: npm test

      - name: パッケージを作成
        # 署名はしない（証明書が要るため）。未署名でも起動はできる
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish never

      # 作ったパッケージが本当に起動するかを、配布物そのもので確かめる
      - name: パッケージの起動確認（Linux）
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a ./dist/*.AppImage --smoke --no-sandbox \
            | tee smoke.log
          grep -q '正常に描画できました' smoke.log

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: excella-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-Setup-*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    # タグから起動されたときだけ Release を作る
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release を作成して添付
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
          body: |
            ## インストール時の注意

            配布物には**コード署名をしていません**。そのため初回起動時に警告が出ます。

            - **Windows**: `Excella-Setup-x.y.z.exe` をダブルクリック。SmartScreen が出たら「詳細情報」→「実行」。
              インストーラは 1 つだけで、管理者権限は不要です（ユーザー単位でインストール）
            - **macOS**: `.dmg` を開いてアプリを右クリック →「開く」→ もう一度「開く」

            署名するには Apple Developer ID や Windows のコード署名証明書が必要です。
