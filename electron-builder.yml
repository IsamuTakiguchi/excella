appId: dev.excella.app
productName: Excella
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
linux:
  category: Office
  icon: build/icon.png
  # ウィンドウと .desktop エントリを結び付ける（無いと起動中の窓が紐づかない）
  syncDesktopName: true
  target:
    - AppImage
    - deb
fileAssociations:
  - ext: xlsx
    name: Excel ブック
    role: Editor
  - ext: csv
    name: CSV
    role: Editor
